name: CI

on:
  push:
    branches: [main]   

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # NuGet.org Trusted Publishing (OIDC) can't run inside reusable-ci.yml itself: a
  # reusable workflow's OIDC token always names ITS OWN hosting repo/file in the
  # job_workflow_ref claim, never the caller's, no matter how the nuget.org trust
  # policy is configured (see reusable-ci.yml's nuget-auth-mode input for the full
  # explanation, and github.com/NuGet/login issues #6 and #24). So reusable-ci.yml is
  # called here with publish-to-nuget: false -- it still bumps the version, writes the
  # changelog, tags, creates the GitHub Release, builds/tests/packs, and uploads
  # pkg-*/symbols-* artifacts; it just skips its own internal NuGet publish step.
  # publish-nuget-oidc below does the actual push, as steps running directly in THIS
  # file via the KiarashMinoo/.github/.github/actions/nuget-oidc-publish composite
  # action -- because that action's steps execute inline in this job (not inside a
  # called reusable workflow), the OIDC token's job_workflow_ref names this repo +
  # this file, matching a Trusted Publishing policy configured with Repository
  # Owner=KiarashMinoo, Repository=PasswordGeneratorCLI, Workflow File=ci.yml. Requires
  # a NUGET_USER repo secret (the nuget.org username the policy is attached to) --
  # Settings > Secrets and variables > Actions > Secrets.
  #
  # IMPORTANT: a job-level `permissions:` block is exhaustive, not additive -- any
  # scope not listed here is implicitly set to "none" for every nested job the called
  # reusable workflow runs, regardless of what that nested job requests for itself --
  # and GitHub validates this statically against every job reusable-ci.yml DECLARES,
  # not just the ones that will actually execute once `if:` conditions are evaluated.
  # So even with publish-to-nuget: false (which only skips publish-nuget/
  # cleanup-nuget-artifacts at runtime), this must still list every scope those two
  # jobs declare needing: contents:write (version/changelog commit, tag, GitHub
  # Release), packages:write + id-token:write (publish-nuget's GitHub Packages / OIDC
  # paths), actions:write (cleanup-nuget-artifacts, to delete run artifacts) -- or the
  # run fails at startup with "requesting X, but is only allowed none".
  ci:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: write
    uses: KiarashMinoo/.github/.github/workflows/reusable-ci.yml@main
    with:
      channel: release
      solution-path: 'PasswordGenerator.sln'
      publish-to-nuget: false
      nuget-filter-enabled: true
      platforms: '["AnyCpu"]'
      configurations: '["Release"]'
      dotnet-versions: 10.0.x
      bump-component: patch
    secrets:
      gh-token: ${{ secrets.GITHUB_TOKEN }}
      push-token: ${{ secrets.ADMIN_PUSH_TOKEN }}

  publish-nuget-oidc:
    name: Publish packages (OIDC Trusted Publishing)
    needs: [ci]
    if: always() && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: KiarashMinoo/.github/.github/actions/nuget-oidc-publish@main
        with:
          nuget-user: ${{ secrets.NUGET_USER }}
          nuget-filter-enabled: false